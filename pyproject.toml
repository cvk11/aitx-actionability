[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aitx-actionability"
version = "0.1.0"
description = "Evidence-grounded therapeutic actionability report generator (SAIL AI-Tx Challenge, Tier 3)"
requires-python = ">=3.11"
dependencies = [
  "anthropic==2.3.0",
  "httpx==0.28.1",
  "pydantic==2.14.2",
  "tenacity==9.1.4",
  "python-dotenv==1.2.4",
]

[project.optional-dependencies]
deploy = ["gradio==6.31.0", "fastapi==0.162.0", "uvicorn==0.54.0"]
dev = ["pytest==9.2.0", "respx==0.23.1", "gradio_client==2.7.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits free public biomedical APIs (no credentials, no cost)"]
addopts = "-m 'not live'"
